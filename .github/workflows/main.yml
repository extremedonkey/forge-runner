name: Main - build, live deploy, live smoke, auto-rollback

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  LIVE_FUNCTION: grok-claude-hello
  LIVE_URL: https://6y5xqyafkixzlj4k2nenhy63ou0ngkmi.lambda-url.ap-southeast-2.on.aws/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # npm test runs in its own job (test, below): the PR already ran it on this code, so it no longer delays deploy-live.
      # Poki build target: dist/poki/ uploaded as artifact "forge-runner-poki" (the download is a zip with index.html at
      # its root, same contents as dist/forge-runner-poki.zip).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-runner-poki
          path: dist/poki/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: function-zip
          path: dist/function.zip
          retention-days: 30
      - name: Live deploy gate
        run: |
          if [ "${{ vars.LIVE_DEPLOY_ENABLED }}" = "true" ]; then
            echo "LIVE_DEPLOY_ENABLED=true: live deploy will run" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "LIVE_DEPLOY_ENABLED is '${{ vars.LIVE_DEPLOY_ENABLED }}' (not 'true'): live deploy SKIPPED" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Build tests (node only, no browser): site build unchanged (FR_BUILD='site', no Poki SDK), Poki build flags/paths/size/URLs,
  # and the sim suites. Same as the PR's build job; here it runs beside deploy-live (not before it) and only reports: a red
  # test on main means fix forward with a PR. The live smoke + auto-rollback in deploy-live still guard the live site.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Poki build in Chromium (served from a subpath). Own job with a short timeout: deploy-live does NOT depend on it, so it can never block or delay the live deploy.
  poki-browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (no apt deps; the runner image has them)
        run: npx playwright install chromium
      - name: Poki build in Chromium
        run: npm run test:poki-browser
      # sparks PR10: sparks smoke on BOTH builds (local server: ?sk=500 row/buy/retry at 3 viewports, earn/save/load, throwing
      # storage, ?sk ignored on Poki) and the seeded canvas hashes vs scripts/canvas-baselines.json (update: npm run test:canvas:update)
      - name: Sparks smoke, site + Poki builds in Chromium
        timeout-minutes: 3
        run: npm run test:sparks-browser
      - name: Hills sprites on their hitboxes on a crest (pixel diff, Poki build, 3 viewports)   # Mobile #80 review, blocker 1
        timeout-minutes: 2
        run: npm run test:hills-browser
      - name: BIG AIR label size at 390x844 + reduced-motion static fallback (real fonts, Poki build)   # Playtest #80 retest
        timeout-minutes: 2
        run: npm run test:bigair-browser
      - name: Seeded canvas hashes, site + Poki builds
        timeout-minutes: 2
        run: npm run test:canvas
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles('canvas-actual/*') != ''
        with:
          name: canvas-actual-${{ github.run_id }}
          path: canvas-actual/
          retention-days: 7

  deploy-live:
    needs: build
    if: vars.LIVE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # apt (--with-deps) has been hanging on the runners (23 Oct 2026): bound it to 2 min, then fall back to the browser alone.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Cached browser, no apt deps (the runner image has them; --with-deps used to cost ~20 s and sometimes hung), as the browser jobs do.
      - name: Install Chromium (cached, no apt deps)
        run: npx playwright install chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: function-zip, path: dist }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_LIVE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: forge-runner-main-${{ github.run_id }}
      - name: Save current live code (rollback zip)
        run: |
          mkdir -p rollback
          aws lambda get-function --function-name "$LIVE_FUNCTION" --query 'Configuration.CodeSha256' --output text > rollback/codesha256.txt
          LOC=$(aws lambda get-function --function-name "$LIVE_FUNCTION" --query 'Code.Location' --output text)
          curl -fsSL -o rollback/live-rollback.zip "$LOC"
          python3 -c "import zipfile; zipfile.ZipFile('rollback/live-rollback.zip').testzip()"
          echo "Rollback saved: CodeSha256 $(cat rollback/codesha256.txt)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-rollback-${{ github.run_id }}
          path: rollback/
          retention-days: 30
      - name: Deploy code to live (code only; env vars untouched)
        id: deploy
        run: |
          aws lambda update-function-code --function-name "$LIVE_FUNCTION" \
            --zip-file fileb://dist/function.zip --query '[FunctionName,CodeSha256]' --output text
          aws lambda wait function-updated-v2 --function-name "$LIVE_FUNCTION"
      - name: Live smoke test
        id: smoke
        run: npm run smoke -- "$LIVE_URL" --out screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 14
      - name: Roll back on failed smoke
        if: failure() && (steps.smoke.conclusion == 'failure' || steps.deploy.conclusion == 'failure')
        run: |
          echo "Live deploy/smoke FAILED: rolling back to $(cat rollback/codesha256.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          aws lambda update-function-code --function-name "$LIVE_FUNCTION" \
            --zip-file fileb://rollback/live-rollback.zip --query CodeSha256 --output text
          aws lambda wait function-updated-v2 --function-name "$LIVE_FUNCTION"
          npm run smoke -- "$LIVE_URL" --out screenshots/after-rollback || echo "WARNING: smoke still failing after rollback"
          exit 1

  # Preview root = latest main, after a GREEN live deploy (never blocks or rolls back live; runs only once deploy-live succeeded):
  #   https://preview.forgerunnergames.com/       -> slot 1 only: forge-runner-preview gets this main's function.zip
  #   https://preview.forgerunnergames.com/poki/  -> this main's Poki build synced to S3 poki/ (replaces the manual upload)
  # Does not touch forge-runner-preview-2 (even-PR smokes). Static /pr-N/ stays on S3.
  # Role forge-runner-ci-live: lambda-code-deploy (covers forge-runner-preview) + inline preview-poki-s3
  # (put/delete on poki/* + CreateInvalidation on E228QWJ5FKCX18).
  # preview-lambda-1 is the same group odd PRs use, so a slot-1 smoke and this deploy never overlap. Even PRs use
  # preview-lambda-2. pr.yml still fails its smoke if CodeSha256 changes mid-run, and skips restore if the code moved on.
  preview-root:
    needs: [build, deploy-live]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serializes with odd-PR smokes on slot 1 (forge-runner-preview) only.
    concurrency:
      group: preview-lambda-1
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    env:
      PREVIEW_FUNCTION: forge-runner-preview
      PREVIEW_BASE: https://preview.forgerunnergames.com
      PREVIEW_DISTRIBUTION: E228QWJ5FKCX18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: function-zip, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: forge-runner-poki, path: dist/poki }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_LIVE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: forge-runner-main-${{ github.run_id }}-preview
      - name: Deploy main to the preview Lambda (preview root)
        run: |
          for i in 1 2 3 4 5; do
            aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
            if aws lambda update-function-code --function-name "$PREVIEW_FUNCTION" \
                 --zip-file fileb://dist/function.zip --query '[FunctionName,CodeSha256]' --output text; then break; fi
            [ "$i" = 5 ] && exit 1; sleep 20
          done
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
      - name: Upload Poki build to s3 poki/
        if: vars.POKI_PREVIEW_PIN != 'true'
        run: scripts/upload-preview.sh dist/poki poki/
      - name: Invalidate /poki on the preview distribution
        if: vars.POKI_PREVIEW_PIN != 'true'
        run: aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION" --paths "/poki" "/poki/*" --query 'Invalidation.[Id,Status]' --output text
      - name: Check preview root and /poki/
        run: |
          for path in / /poki/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_BASE$path")
            echo "$PREVIEW_BASE$path -> $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = 200 ] || exit 1
          done
