name: PR - build, preview deploy, smoke, auto-merge

on:
  pull_request:
    # Explicit types so marking a draft "Ready for review" starts a run (and can automerge). The default list
    # (opened, synchronize, reopened) has no ready_for_review. `closed` is deliberately NOT here: the close-only
    # preview delete lives in pr-preview-cleanup.yml (types: [closed], unmerged PRs only).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Per-PR concurrency: a new push to a PR cancels only that PR's older run; different PRs never cancel each other.
# Preview smokes use two Lambdas (odd PR → slot 1, even PR → slot 2). Each slot is serialized by the `preview` job.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # npm test runs in its own job (test, below), so preview / pr-preview-site start as soon as these artifacts exist.
      # automerge guard (live labels/draft check) with a stubbed gh: label/draft/closed skip, gh failure fails closed.
      - run: bash scripts/test-automerge-guard.sh
      # Poki build target: dist/poki/ uploaded as artifact "forge-runner-poki" (the download is a zip with index.html at
      # its root, same contents as dist/forge-runner-poki.zip).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-runner-poki
          path: dist/poki/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: function-zip
          path: dist/function.zip
          retention-days: 7

  # Build tests (node only, no browser): site build unchanged (FR_BUILD='site', no Poki SDK), Poki build flags/paths/size/URLs,
  # and the sim suites. Own job, beside build (it does its own npm ci + build, ~1 s): the preview deploy + smoke only need build's
  # artifacts, so they no longer wait ~3-5 min for npm test. automerge needs it.
  # Two shards: each runs the non-sim checks plus half of the sim suites (SIMS_SHARD in scripts/test-build.mjs balances them by
  # rough run time), so the slow sims no longer share one 4-core runner. automerge needs both (needs: test waits for the matrix).
  test:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          SIMS_SHARD: ${{ matrix.shard }}

  # Poki build in Chromium (served from a subpath), then the sparks smoke + seeded canvas hashes for both builds. Own job with a short timeout: a slow browser install can't hold up the build/preview jobs. automerge still waits for it.
  # The browser suites are split over two jobs (~2.3 min each) that start right away, beside build: each job does its own
  # npm ci + build (~1 s), so neither waits for build's npm test. automerge needs both. Keep the two roughly balanced when adding a
  # browser suite (CONTRIBUTING.md "Keeping CI lean"). Timings (Oct 2026): sparks 108 s, missions 93 s, lvmarker 42 s, poki 24 s, canvas 5 s.
  poki-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (no apt deps; the runner image has them)
        run: npx playwright install chromium
      - name: Poki build in Chromium
        run: npm run test:poki-browser
      # sparks PR10: sparks smoke on BOTH builds (local server: ?sk=500 row/buy/retry at 3 viewports, earn/save/load, throwing
      # storage, ?sk ignored on Poki) and the seeded canvas hashes vs scripts/canvas-baselines.json (update: npm run test:canvas:update)
      - name: Sparks smoke, site + Poki builds in Chromium
        timeout-minutes: 3
        run: npm run test:sparks-browser
      - name: Hills sprites on their hitboxes on a crest (pixel diff, Poki build, 3 viewports)   # Mobile #80 review, blocker 1
        timeout-minutes: 2
        run: npm run test:hills-browser
      - name: BIG AIR label size at 390x844 + reduced-motion static fallback (real fonts, Poki build)   # Playtest #80 retest
        timeout-minutes: 2
        run: npm run test:bigair-browser
      - name: Seeded canvas hashes, site + Poki builds
        timeout-minutes: 2
        run: npm run test:canvas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && hashFiles('canvas-actual/*') != ''
        with:
          name: canvas-actual-${{ github.run_id }}
          path: canvas-actual/
          retention-days: 7

  # Second half of the browser suites (see poki-browser above).
  ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (no apt deps; the runner image has them)
        run: npx playwright install chromium
      - run: npm run test:missions-browser   # MISSIONS-2: Retry first+largest on game over, one Space/tap restarts (web + Poki, 4 sizes)
      # PZ #66 follow-up: portrait level marker (LV n) >= 8 CSS px from the mute button, site + Poki, 4 sizes, ZM 1.35 and 1.12
      - name: Level marker clears mute, site + Poki builds
        timeout-minutes: 2
        run: npm run test:lvmarker-browser
      # PIT STOP (14c): drive onto the pit deck, park, buy, Continue (lab page = live fragment + probe; 3 sizes + level mode)
      - name: Pit stop park, buy, continue
        timeout-minutes: 3
        run: npm run test:pitstop-browser
      # FIRST 30 s (15b): spark trail, combo, praise, free power-up; novice-bot death rate stays <= 31.5%
      - name: First 30 seconds (novice bot)
        timeout-minutes: 15
        run: CHECK=1 npm run test:first30

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # OIDC tokens are only issued to PRs from branches in this repo (not forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Two preview Lambdas, one slot per PR number (same rule as the "Assign preview slot" step):
    #   odd  → slot 1, forge-runner-preview,     preview-lambda-1 (also main.yml preview-root)
    #   even → slot 2, forge-runner-preview-2,   preview-lambda-2
    # Same slot: deploy + smoke + restore one PR at a time (the #107 race fix). Different slots run together.
    # queue: max keeps up to 100 waiting jobs FIFO (queue: single would cancel a waiting job when the next one arrives).
    concurrency:
      # Even last digit → 2, otherwise 1. Same as PR number % 2 (shell step below checks they match).
      group: preview-lambda-${{ case(endsWith(format('{0}', github.event.pull_request.number), '0') || endsWith(format('{0}', github.event.pull_request.number), '2') || endsWith(format('{0}', github.event.pull_request.number), '4') || endsWith(format('{0}', github.event.pull_request.number), '6') || endsWith(format('{0}', github.event.pull_request.number), '8'), '2', '1') }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: read
    steps:
      # Odd pull_request.number → slot 1. Even → slot 2. Must match concurrency.group preview-lambda-<slot> above.
      - name: Assign preview slot
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPR_SLOT: ${{ case(endsWith(format('{0}', github.event.pull_request.number), '0') || endsWith(format('{0}', github.event.pull_request.number), '2') || endsWith(format('{0}', github.event.pull_request.number), '4') || endsWith(format('{0}', github.event.pull_request.number), '6') || endsWith(format('{0}', github.event.pull_request.number), '8'), '2', '1') }}
        run: |
          slot=$(( PR_NUMBER % 2 == 0 ? 2 : 1 ))
          if [ "$slot" != "$EXPR_SLOT" ]; then
            echo "Preview slot mismatch: shell=$slot concurrency expression=$EXPR_SLOT"
            exit 1
          fi
          case "$slot" in
            1) fn=forge-runner-preview
               url=https://3nslnfimuztmjlqvbt4rdp4w2q0lpfoe.lambda-url.ap-southeast-2.on.aws/ ;;
            2) fn=forge-runner-preview-2
               url=https://a6q4b5ztv77ugjbmkqtodof6ve0zbpoz.lambda-url.ap-southeast-2.on.aws/ ;;
            *) echo "Bad preview slot $slot for PR #$PR_NUMBER"; exit 1 ;;
          esac
          echo "PREVIEW_SLOT=$slot" >> "$GITHUB_ENV"
          echo "PREVIEW_FUNCTION=$fn" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "PR #$PR_NUMBER → preview slot $slot ($fn)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # apt (--with-deps) has been hanging on the runners (23 Oct 2026): bound it to 2 min, then fall back to the browser alone.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Cached browser, no apt deps (the runner image has them; --with-deps used to cost ~20 s and sometimes hung), as the browser jobs do.
      - name: Install Chromium (cached, no apt deps)
        run: npx playwright install chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: function-zip, path: dist }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PREVIEW_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: forge-runner-pr-${{ github.event.pull_request.number }}
      # Slot 1 is the preview root (https://preview.forgerunnergames.com/): main.yml sets forge-runner-preview to the latest
      # main after each green live deploy. Slot 2 is smoke-only; main never writes it. This PR's code is only on the
      # assigned function for the smoke below, then the saved zip is put back. Static /pr-N/ stays on S3.
      - name: Save current preview code for restore
        run: |
          mkdir -p restore
          aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Configuration.CodeSha256' --output text > restore/codesha256.txt
          curl -fsSL -o restore/preview-main.zip "$(aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Code.Location' --output text)"
          python3 -c "import zipfile; zipfile.ZipFile('restore/preview-main.zip').testzip()"
          echo "Saved preview code $(cat restore/codesha256.txt) from $PREVIEW_FUNCTION (slot $PREVIEW_SLOT)"
      - name: Deploy code to the assigned preview Lambda (code only; env vars untouched)
        run: |
          aws lambda update-function-code --function-name "$PREVIEW_FUNCTION" \
            --zip-file fileb://dist/function.zip --query '[FunctionName,CodeSha256]' --output text
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
          aws lambda get-function --function-name "$PREVIEW_FUNCTION" \
            --query 'Configuration.[LastUpdateStatus,CodeSha256]' --output text
          aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Configuration.CodeSha256' --output text > restore/deployed-codesha256.txt
      # Slot 1 shares preview-lambda-1 with main.yml preview-root. Slot 2 is a different function (preview-lambda-2).
      # Still fail the smoke if CodeSha256 changes during the run.
      - name: Smoke test preview
        run: |
          npm run smoke -- "$PREVIEW_URL" --out screenshots
          now=$(aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Configuration.CodeSha256' --output text)
          [ "$now" = "$(cat restore/deployed-codesha256.txt)" ] || { echo "Preview Lambda code changed during the smoke ($now): smoke not trusted, re-run this PR"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: preview-screenshots-pr${{ github.event.pull_request.number }}
          path: screenshots/
          retention-days: 14
      - name: Restore the assigned preview Lambda to the saved code
        if: always() && hashFiles('restore/preview-main.zip') != ''
        continue-on-error: true
        run: |
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
          now=$(aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Configuration.CodeSha256' --output text)
          if [ -s restore/deployed-codesha256.txt ] && [ "$now" != "$(cat restore/deployed-codesha256.txt)" ]; then
            echo "Preview Lambda $PREVIEW_FUNCTION is no longer this PR's code ($now; slot 1: main.yml preview-root deployed newer main?): not restoring"; exit 0
          fi
          aws lambda update-function-code --function-name "$PREVIEW_FUNCTION" \
            --zip-file fileb://restore/preview-main.zip --query CodeSha256 --output text
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
          echo "Restored $PREVIEW_FUNCTION (slot $PREVIEW_SLOT) to $(cat restore/codesha256.txt)"

  # Static per-PR preview: https://preview.forgerunnergames.com/pr-<n>/ (game page) and /pr-<n>/poki/ (Poki build),
  # served from S3 prefix pr-<n>/ through CloudFront E228QWJ5FKCX18 (behaviours /pr-*/poki* and /pr-*, noindex headers).
  # Role forge-runner-ci-preview: put/delete on pr-* keys only + CreateInvalidation on E228QWJ5FKCX18 (inline policy pr-previews-s3).
  pr-preview-site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      PREVIEW_BASE: https://preview.forgerunnergames.com
      PREVIEW_DISTRIBUTION: E228QWJ5FKCX18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build static preview (dist/pr-preview)
        run: node scripts/build-pr-preview.mjs
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PREVIEW_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: forge-runner-pr-${{ github.event.pull_request.number }}-site
      - name: Upload to s3 pr-<n>/
        run: scripts/upload-preview.sh dist/pr-preview "pr-$PR/"
      - name: Invalidate /pr-<n>/ on the preview distribution
        run: aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION" --paths "/pr-$PR" "/pr-$PR/*" --query 'Invalidation.[Id,Status]' --output text
      - name: Check preview URLs (200 + noindex)
        run: |
          for path in "/pr-$PR/" "/pr-$PR/poki/"; do
            ok=
            for i in $(seq 1 12); do
              h=$(curl -sS -o /dev/null -D - "$PREVIEW_BASE$path" || true)
              if echo "$h" | head -1 | grep -q ' 200' && echo "$h" | grep -qi '^x-robots-tag: noindex'; then ok=1; break; fi
              sleep 5
            done
            [ -n "$ok" ] || { echo "FAIL $PREVIEW_BASE$path"; echo "$h"; exit 1; }
            echo "OK $PREVIEW_BASE$path (200, x-robots-tag noindex)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Comment the preview link (one comment per PR, updated on each push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARK='<!-- forge-runner-pr-preview -->'
          BODY="$MARK
          **Preview:** $PREVIEW_BASE/pr-$PR/
          **Poki build:** $PREVIEW_BASE/pr-$PR/poki/

          Commit \`${HEAD_SHA:0:7}\` · [run]($RUN_URL) · noindex (not for sharing publicly)"
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARK\"))) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" --jq .html_url
          fi

  automerge:
    # Free private repos have no branch protection/native auto-merge, so this job is the gate:
    # it only runs if build, test, poki-browser, ui-browser, preview (deploy + smoke) AND pr-preview-site (S3 upload + URL check) succeeded.
    # The `if:` below is only an early skip: event-payload labels are STALE (`gh pr create --label` adds the label in a later
    # event than `opened`, and re-runs reuse the old payload; PR #45 merged that way). The real gate is the live check in
    # scripts/automerge-guard.sh right before the merge: `no-automerge` label, draft, or not open -> no merge; gh error -> fail closed.
    needs: [build, test, preview, poki-browser, ui-browser, pr-preview-site]
    if: success() && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # merge
      pull-requests: write   # merge; includes the read the live guard needs (labels, isDraft, state)
      actions: write         # dispatch main.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Live guard, then squash-merge the green PR
        id: merge
        # Guard reads labels/draft/state from GitHub NOW (not the event payload), immediately before the merge.
        # Immediate merge (no --auto, nothing queued), so a label added later can't be bypassed by a pending auto-merge.
        # --match-head-commit: only merge the exact commit this run tested.
        run: |
          rc=0; scripts/automerge-guard.sh "$PR" "$GITHUB_REPOSITORY" || rc=$?
          case "$rc" in
            0)  ;;
            78) echo "Automerge SKIPPED for PR #$PR (live guard: no-automerge label, draft, or not open)" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            *)  echo "Automerge guard ERROR (exit $rc) for PR #$PR: fail closed, NOT merging" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
          esac
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: Trigger main pipeline
        if: steps.merge.outputs.merged == 'true'
        # Pushes made with GITHUB_TOKEN don't start new workflow runs, so dispatch it explicitly.
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main
      # The merged PR's static preview (s3 pr-<n>/) is deliberately KEPT: playtests use it for ~24 h after the merge.
      # S3 lifecycle rule expire-pr-previews-14d (prefix pr-) removes it after 14 days. Don't add a delete-on-merge step here.
