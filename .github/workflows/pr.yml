name: PR - build, preview deploy, smoke, auto-merge

on:
  pull_request:
    branches: [main]

# One preview Lambda is shared by all PRs: deploy+smoke one PR at a time.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  PREVIEW_FUNCTION: forge-runner-preview
  PREVIEW_URL: https://3nslnfimuztmjlqvbt4rdp4w2q0lpfoe.lambda-url.ap-southeast-2.on.aws/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Build tests (node only, no browser): site build unchanged (FR_BUILD='site', no Poki SDK), Poki build flags/paths/size/URLs.
      - run: npm test
      # Poki build target: dist/poki/ uploaded as artifact "forge-runner-poki" (the download is a zip with index.html at
      # its root, same contents as dist/forge-runner-poki.zip).
      - uses: actions/upload-artifact@v4
        with:
          name: forge-runner-poki
          path: dist/poki/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: function-zip
          path: dist/function.zip
          retention-days: 7

  # Poki build in Chromium (served from a subpath). Own job with a short timeout: a slow browser install can't hold up the build/preview jobs. automerge still waits for it.
  poki-browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (no apt deps; the runner image has them)
        run: npx playwright install chromium
      - name: Poki build in Chromium
        run: npm run test:poki-browser
      - run: npm run test:missions-browser   # MISSIONS-2: Retry first+largest on game over, one Space/tap restarts (web + Poki, 4 sizes)

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # OIDC tokens are only issued to PRs from branches in this repo (not forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # apt (--with-deps) has been hanging on the runners (23 Oct 2026): bound it to 2 min, then fall back to the browser alone.
      - name: Install Chromium (bounded apt deps, fallback without)
        run: timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium
      - uses: actions/download-artifact@v4
        with: { name: function-zip, path: dist }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PREVIEW_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: forge-runner-pr-${{ github.event.pull_request.number }}
      # The preview root (https://preview.forgerunnergames.com/) shows the preview Lambda, which main.yml sets to the latest
      # main after each green live deploy. This PR's code is only on it for the smoke test below, then put back.
      - name: Save current preview code (latest main) for restore
        run: |
          mkdir -p restore
          aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Configuration.CodeSha256' --output text > restore/codesha256.txt
          curl -fsSL -o restore/preview-main.zip "$(aws lambda get-function --function-name "$PREVIEW_FUNCTION" --query 'Code.Location' --output text)"
          python3 -c "import zipfile; zipfile.ZipFile('restore/preview-main.zip').testzip()"
          echo "Saved preview code $(cat restore/codesha256.txt)"
      - name: Deploy code to preview (code only; env vars untouched)
        run: |
          aws lambda update-function-code --function-name "$PREVIEW_FUNCTION" \
            --zip-file fileb://dist/function.zip --query '[FunctionName,CodeSha256]' --output text
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
          aws lambda get-function --function-name "$PREVIEW_FUNCTION" \
            --query 'Configuration.[LastUpdateStatus,CodeSha256]' --output text
      - name: Smoke test preview
        run: npm run smoke -- "$PREVIEW_URL" --out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots-pr${{ github.event.pull_request.number }}
          path: screenshots/
          retention-days: 14
      - name: Restore preview root to the saved code (latest main)
        if: always() && hashFiles('restore/preview-main.zip') != ''
        continue-on-error: true
        run: |
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
          aws lambda update-function-code --function-name "$PREVIEW_FUNCTION" \
            --zip-file fileb://restore/preview-main.zip --query CodeSha256 --output text
          aws lambda wait function-updated-v2 --function-name "$PREVIEW_FUNCTION"
          echo "Preview root restored to $(cat restore/codesha256.txt)"

  # Static per-PR preview: https://preview.forgerunnergames.com/pr-<n>/ (game page) and /pr-<n>/poki/ (Poki build),
  # served from S3 prefix pr-<n>/ through CloudFront E228QWJ5FKCX18 (behaviours /pr-*/poki* and /pr-*, noindex headers).
  # Role forge-runner-ci-preview: put/delete on pr-* keys only + CreateInvalidation on E228QWJ5FKCX18 (inline policy pr-previews-s3).
  pr-preview-site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      PREVIEW_BASE: https://preview.forgerunnergames.com
      PREVIEW_DISTRIBUTION: E228QWJ5FKCX18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build static preview (dist/pr-preview)
        run: node scripts/build-pr-preview.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PREVIEW_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: forge-runner-pr-${{ github.event.pull_request.number }}-site
      - name: Upload to s3 pr-<n>/
        run: scripts/upload-preview.sh dist/pr-preview "pr-$PR/"
      - name: Invalidate /pr-<n>/ on the preview distribution
        run: aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION" --paths "/pr-$PR" "/pr-$PR/*" --query 'Invalidation.[Id,Status]' --output text
      - name: Check preview URLs (200 + noindex)
        run: |
          for path in "/pr-$PR/" "/pr-$PR/poki/"; do
            ok=
            for i in $(seq 1 12); do
              h=$(curl -sS -o /dev/null -D - "$PREVIEW_BASE$path" || true)
              if echo "$h" | head -1 | grep -q ' 200' && echo "$h" | grep -qi '^x-robots-tag: noindex'; then ok=1; break; fi
              sleep 5
            done
            [ -n "$ok" ] || { echo "FAIL $PREVIEW_BASE$path"; echo "$h"; exit 1; }
            echo "OK $PREVIEW_BASE$path (200, x-robots-tag noindex)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Comment the preview link (one comment per PR, updated on each push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARK='<!-- forge-runner-pr-preview -->'
          BODY="$MARK
          **Preview:** $PREVIEW_BASE/pr-$PR/
          **Poki build:** $PREVIEW_BASE/pr-$PR/poki/

          Commit \`${HEAD_SHA:0:7}\` · [run]($RUN_URL) · noindex (not for sharing publicly)"
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARK\"))) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" --jq .html_url
          fi

  automerge:
    # Free private repos have no branch protection/native auto-merge, so this job is the gate:
    # it only runs if build, poki-browser, preview (deploy + smoke) AND pr-preview-site (S3 upload + URL check) succeeded.
    needs: [build, preview, poki-browser, pr-preview-site]
    if: success() && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Squash-merge the green PR
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      - name: Trigger main pipeline
        # Pushes made with GITHUB_TOKEN don't start new workflow runs, so dispatch it explicitly.
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main
