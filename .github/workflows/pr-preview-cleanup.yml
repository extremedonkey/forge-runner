name: PR - delete preview on close (unmerged only)

# Deletes s3 pr-<n>/ (https://preview.forgerunnergames.com/pr-<n>/) only when a PR is closed WITHOUT merging.
# Merged PRs keep their preview (playtests use it for ~24 h after the merge); the S3 lifecycle rule expire-pr-previews-14d
# (prefix pr-) expires all pr-* previews after 14 days. (Merges by pr.yml's automerge job use GITHUB_TOKEN and don't fire this anyway.)
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  delete-preview:
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PREVIEW_ARN }}
          aws-region: ap-southeast-2
          role-session-name: forge-runner-pr-${{ github.event.pull_request.number }}-cleanup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete s3 pr-<n>/
        run: scripts/upload-preview.sh --delete "pr-$PR/"
      - name: Invalidate /pr-<n>/
        run: aws cloudfront create-invalidation --distribution-id E228QWJ5FKCX18 --paths "/pr-$PR" "/pr-$PR/*" --query 'Invalidation.Id' --output text
